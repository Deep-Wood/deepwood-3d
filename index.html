<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeepWood — 3D Prototype (Campfire View)</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #0b120c; overflow: hidden; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }

      .panel {
        position: absolute; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #e8dfc8; background: rgba(10, 18, 12, 0.72); border: 1px solid #2f4a35;
        border-radius: 8px; padding: 10px 12px; backdrop-filter: blur(4px);
        text-shadow: 0 1px 2px #000;
      }
      #hud { left: 14px; top: 14px; min-width: 232px; }
      #hud h1 { margin: 0 0 6px; font: 600 13px/1.2 ui-monospace, monospace; letter-spacing: 1.5px; color: #cfe6c8; }
      #hud .row { display: flex; justify-content: space-between; gap: 14px; }
      #hud .row span:last-child { color: #fff; }
      #hud .sep { height: 1px; background: #2f4a35; margin: 7px 0; }
      #hud .note { color: #9fb69a; font-size: 11px; }
      #hud .warn { color: #ffd479; }

      #controls { right: 14px; bottom: 14px; }
      #controls .k { color: #ffd479; }
      button.clip {
        font: inherit; color: #e8dfc8; background: rgba(20, 34, 24, 0.9);
        border: 1px solid #4a7c59; border-radius: 6px; padding: 3px 9px; margin: 0 4px 4px 0; cursor: pointer;
      }
      button.clip[aria-pressed="true"] { background: #4a7c59; color: #0b120c; font-weight: 600; }

      #loading {
        position: absolute; inset: 0; display: grid; place-items: center; background: #0b120c;
        color: #cfe6c8; font: 14px/1.6 ui-monospace, monospace; transition: opacity .4s; z-index: 10;
      }
      #loading.hidden { opacity: 0; pointer-events: none; }
      #bar { width: 240px; height: 4px; background: #1d2c21; border-radius: 2px; overflow: hidden; margin-top: 10px; }
      #bar > i { display: block; height: 100%; width: 0%; background: #6fbf73; transition: width .2s; }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="hud" class="panel">
      <h1>DEEPWOOD · 3D PROTOTYPE</h1>
      <div class="row"><span>fps</span><span id="fps">–</span></div>
      <div class="row"><span>draw calls</span><span id="calls">–</span></div>
      <div class="row"><span>triangles</span><span id="tris">–</span></div>
      <div class="row"><span>trees (instanced)</span><span id="trees">–</span></div>
      <div class="sep"></div>
      <div class="row"><span>renderer</span><span id="api">–</span></div>
      <div class="row"><span>webgpu</span><span id="gpuhint">–</span></div>
      <div class="row"><span>texture budget</span><span id="tex">–</span></div>
      <div class="sep"></div>
      <div class="note" id="sources">
        trees: Poly Haven (CC0) · character: three.js sample rig (placeholder)
      </div>
      <div class="note warn" id="perf"></div>
    </div>

    <div id="controls" class="panel">
      <div><span class="k">W A S D</span> move · <span class="k">Shift</span> run · <span class="k">drag</span> orbit · <span class="k">wheel</span> zoom</div>
      <div style="margin-top:6px">
        animation:
        <button class="clip" data-clip="Idle" aria-pressed="true">Idle</button>
        <button class="clip" data-clip="Walk">Walk</button>
        <button class="clip" data-clip="Run">Run</button>
      </div>
      <div style="margin-top:6px">
        <button class="clip" id="toggle-shadows">shadows: on</button>
        <button class="clip" id="toggle-wind">wind: on</button>
      </div>
    </div>

    <div id="loading">
      <div style="text-align:center">
        loading forest assets…
        <div id="bar"><i></i></div>
        <div id="loading-note" style="opacity:.6;margin-top:8px">glTF + PBR texture sets · 1k</div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
